<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ServiceMind · Worker</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/worker.css" />
  <script src="/assets/worker.js" defer></script>
</head>
<body>
  <div class="app-shell worker-shell">
    <header class="topbar">
      <a class="brand" href="/admin"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>servicemind<span class="brand-dot">.</span></span></a>
      <nav class="view-switch" aria-label="Choose a view">
        <a href="/admin">Admin</a><a id="worker-a-link" href="/worker/A">Worker A</a><a id="worker-b-link" href="/worker/B">Worker B</a>
      </nav>
    </header>
    <main class="worker-layout">
      <section class="worker-header" aria-label="Your shift">
        <h1 id="worker-title">Hi, Worker.</h1>
        <button id="availability-button" class="availability-button" type="button" data-worker-action="availability" data-action-key="availability" data-pending-label="Updating…" disabled>Loading…</button>
      </section>
      <p id="connection-label" class="connection-warning" role="status" hidden>Reconnecting…</p>
      <section class="panel task-panel" aria-label="Your task">
        <div id="my-task" aria-live="polite"><p class="idle-state">Loading your shift…</p></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
